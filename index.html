<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Workspace Portal — GitHub Pages Index</title>
  <meta name="description" content="GitHub Pages HTML 프로젝트 및 리포트 통합 인덱스 포털">
  <meta name="theme-color" content="#f8fafc" id="meta-theme-color">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('portal_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --surface-hover: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --accent: #0f172a;
      --accent-fg: #ffffff;
      --primary: #2563eb;
      --primary-subtle: #eff6ff;
      --primary-border: #bfdbfe;
      --coffee-bg: #fef3c7;
      --coffee-text: #92400e;
      --taiwan-bg: #ffe4e6;
      --taiwan-text: #be123c;
      --realty-bg: #e0e7ff;
      --realty-text: #3730a3;
      --emerald-bg: #d1fae5;
      --emerald-text: #065f46;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    [data-theme="dark"] {
      --bg: #0b0f17;
      --surface: #131b29;
      --surface-subtle: #1e293b;
      --surface-hover: #1a2436;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #1e293b;
      --border-hover: #334155;
      --accent: #f8fafc;
      --accent-fg: #0f172a;
      --primary: #60a5fa;
      --primary-subtle: rgba(59, 130, 246, 0.14);
      --primary-border: rgba(96, 165, 250, 0.3);
      --coffee-bg: rgba(245, 158, 11, 0.15);
      --coffee-text: #fbbf24;
      --taiwan-bg: rgba(244, 63, 94, 0.15);
      --taiwan-text: #fb7185;
      --realty-bg: rgba(99, 102, 241, 0.15);
      --realty-text: #818cf8;
      --emerald-bg: rgba(16, 185, 129, 0.15);
      --emerald-text: #34d399;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 28px -6px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 64px;
    }

    /* Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: -0.03em;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: none;
    }

    @media (min-width: 640px) {
      .brand-sub {
        display: inline;
      }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .device-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.95rem;
    }

    .icon-btn:hover {
      border-color: var(--border-hover);
      background: var(--surface-subtle);
    }

    /* Hero & Controls */
    .hero {
      padding: 32px 0 20px;
    }

    .hero-top {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 22px;
    }

    @media (min-width: 768px) {
      .hero-top {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
      }
    }

    .hero h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    @media (min-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    /* Search & Filter Toolbar */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .toolbar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .tab-count {
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      font-family: 'JetBrains Mono', monospace;
    }

    .tab-btn.active .tab-count {
      background: rgba(148, 163, 184, 0.35);
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    @media (min-width: 768px) {
      .search-wrap {
        width: 280px;
        flex-shrink: 0;
      }
    }

    .search-input {
      width: 100%;
      padding: 9px 36px 9px 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-subtle);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-kbd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--surface-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border);
      pointer-events: none;
    }

    /* Section Group */
    .category-section {
      margin-bottom: 36px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .section-repo-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 2px 8px;
      border-radius: 6px;
      text-decoration: none;
    }

    .section-repo-badge:hover {
      color: var(--primary);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 980px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-md);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .cat-coffee { background: var(--coffee-bg); color: var(--coffee-text); }
    .cat-taiwan { background: var(--taiwan-bg); color: var(--taiwan-text); }
    .cat-realty { background: var(--realty-bg); color: var(--realty-text); }
    .cat-hub    { background: var(--emerald-bg); color: var(--emerald-text); }

    .card-tools {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mini-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }

    .mini-btn:hover {
      background: var(--surface-subtle);
      color: var(--text-primary);
    }

    .mini-btn.pinned {
      color: #f59e0b;
    }

    .card-title {
      font-size: 1.04rem;
      font-weight: 700;
      line-height: 1.38;
      margin-bottom: 6px;
      letter-spacing: -0.015em;
    }

    .card-title a {
      color: var(--text-primary);
      text-decoration: none;
    }

    .card-title a:hover {
      color: var(--primary);
    }

    .card-desc {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      font-size: 0.72rem;
      color: var(--text-secondary);
      background: var(--surface-subtle);
      padding: 2px 8px;
      border-radius: 5px;
      font-weight: 500;
    }

    /* Card Action Footer */
    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .link-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-primary);
    }

    .link-btn:hover {
      border-color: var(--border-hover);
      background: var(--border);
    }

    .link-btn.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .link-btn.primary:hover {
      opacity: 0.9;
    }

    .link-btn.recommended {
      border-color: var(--primary);
      background: var(--primary-subtle);
      color: var(--primary);
    }

    .sublinks-details {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .sublinks-details summary {
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 500;
      padding: 4px 0;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sublinks-details summary::-webkit-details-marker {
      display: none;
    }

    .sublinks-details summary:hover {
      color: var(--text-primary);
    }

    .sublinks-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      background: var(--surface-subtle);
      border-radius: 8px;
    }

    .sublink-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-secondary);
      padding: 4px 6px;
      border-radius: 5px;
      font-size: 0.76rem;
    }

    .sublink-item:hover {
      background: var(--surface);
      color: var(--primary);
    }

    .mono-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Live GitHub Explorer Box */
    .explorer-box {
      margin-top: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .explorer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .explorer-title {
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sync-btn:hover {
      border-color: var(--border-hover);
    }

    .file-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .file-table th,
    .file-table td {
      text-align: left;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
    }

    .file-table th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
    }

    .file-table tr:last-child td {
      border-bottom: none;
    }

    .file-table a {
      color: var(--primary);
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      word-break: break-all;
    }

    .file-table a:hover {
      text-decoration: underline;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: var(--accent-fg);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
    }
  </style>
</head>
<body>

  <!-- Top Sticky Bar -->
  <header class="top-bar">
    <div class="container header-inner">
      <a href="#" class="brand">
        <div class="brand-logo">H</div>
        <span class="brand-title">HTML Portal</span>
        <span class="brand-sub">holnuwld.github.io</span>
      </a>
      <div class="header-actions">
        <div class="device-pill" id="device-indicator" title="현재 접속 기기에 맞춰 추천 링크를 강조합니다">
          <span class="device-dot"></span>
          <span id="device-text">기기 감지 중</span>
        </div>
        <button class="icon-btn" id="theme-toggle" title="테마 전환 (라이트/다크)" aria-label="테마 전환">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Hero -->
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1>내 GitHub Pages 아카이브</h1>
          <p>제작한 HTML 대시보드와 가이드를 카테고리·기기별(PC/모바일)로 한 번에 연결합니다.</p>
        </div>
      </div>

      <!-- Filter Tabs & Search -->
      <div class="toolbar">
        <div class="tabs" id="category-tabs">
          <button class="tab-btn active" data-cat="all">전체 <span class="tab-count" id="count-all">0</span></button>
          <button class="tab-btn" data-cat="pinned">⭐ 즐겨찾기 <span class="tab-count" id="count-pinned">0</span></button>
          <button class="tab-btn" data-cat="coffee">☕ 스페셜티 커피 <span class="tab-count" id="count-coffee">0</span></button>
          <button class="tab-btn" data-cat="taiwan">✈️ 대만 여행·미식·숙소 <span class="tab-count" id="count-taiwan">0</span></button>
          <button class="tab-btn" data-cat="realty">🏢 부동산 분석 <span class="tab-count" id="count-realty">0</span></button>
        </div>

        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="search" id="search-input" class="search-input" placeholder="제목, 태그, 파일명 검색..." autocomplete="off">
          <span class="search-kbd" id="search-kbd">/</span>
        </div>
      </div>
    </section>

    <!-- Dynamic Portal Sections -->
    <div id="portal-content"></div>

    <!-- GitHub Live HTML Scanner -->
    <section class="explorer-box">
      <div class="explorer-head">
        <div>
          <div class="explorer-title">
            <span>📂 GitHub 저장소 전체 HTML 파일 탐색기</span>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px;">
            <code>holnuwld</code> 계정의 모든 GitHub Pages 저장소에 있는 원본 <code>.html</code> 파일 전체 목록입니다. 새로 업로드한 파일도 실시간 조회가 가능합니다.
          </p>
        </div>
        <button class="sync-btn" id="sync-github-btn">
          <span id="sync-icon">🔄</span> GitHub 실시간 동기화
        </button>
      </div>

      <div style="overflow-x: auto;">
        <table class="file-table" id="raw-files-table">
          <thead>
            <tr>

        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('클립보드에 링크가 복사되었습니다');
      }
    }

              <div class="card-tools">
                <button class="mini-btn" onclick="copyUrl('${primaryHref}')" title="링크 복사" aria-label="링크 복사">🔗</button>
                <button class="mini-btn ${isPinned ? 'pinned' : ''}" onclick="togglePin('${item.id}')" title="즐겨찾기 고정" aria-label="즐겨찾기">
                  ${isPinned ? '★' : '☆'}
                </button>
              </div>
            </div>
            <h3 class="card-title">
              <a href="${primaryHref}" target="_blank" rel="noopener">${item.title}</a>
            </h3>
            <p class="card-desc">${item.desc}</p>
            <div class="tag-row">
              ${item.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
            </div>
          </div>
          <div class="card-footer">
            ${buttonsHtml}
            ${subLinksHtml}
          </div>
        </article>
      `;
    }

    function renderPortal() {
      const container = document.getElementById('portal-content');
      const q = searchQuery.trim().toLowerCase();

      const filtered = PORTAL_ITEMS.filter(item => {
        if (activeCategory === 'pinned' && !pinnedIds.includes(item.id)) return false;
        if (activeCategory !== 'all' && activeCategory !== 'pinned' && item.category !== activeCategory) return false;
        if (!q) return true;
        const hay = [
          item.title,
          item.desc,
          item.repo,
          ...(item.tags || []),
          ...(item.subLinks || []).map(s => s.label + ' ' + s.path)
        ].join(' ').toLowerCase();
        return hay.includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">조건에 맞는 HTML 페이지가 없습니다.</div>`;
        return;
      }

      // If showing 'all' and no search query, show Pinned section at top (if any) + grouped categories
      if (activeCategory === 'all' && !q) {
        let html = '';

        const pinnedItems = filtered.filter(i => pinnedIds.includes(i.id));
        if (pinnedItems.length > 0) {
          html += `
            <section class="category-section">
              <div class="section-header">
                <div class="section-title-group">
                  <h2 class="section-title">⭐ 자주 찾는 페이지 (즐겨찾기)</h2>
                </div>
              </div>
              <div class="grid">
                ${pinnedItems.map(renderCard).join('')}
              </div>
            </section>
          `;
        }

        ['coffee', 'taiwan', 'realty'].forEach(catKey => {
          const catItems = filtered.filter(i => i.category === catKey);
          if (catItems.length === 0) return;
          const meta = CATEGORY_META[catKey];
          html += `
            <section class="category-section">
              <div class="section-header">
                <div class="section-title-group">
                  <h2 class="section-title">${meta.title}</h2>
                </div>
                <a href="https://github.com/${GITHUB_USER}/${catItems[0].repo}" target="_blank" rel="noopener" class="section-repo-badge">
                  github.com/${GITHUB_USER}/${catItems[0].repo} ↗
                </a>
              </div>
              <div class="grid">
                ${catItems.map(renderCard).join('')}
              </div>
            </section>
          `;
        });

        container.innerHTML = html;
      } else {
        container.innerHTML = `
          <section class="category-section">
            <div class="grid">
              ${filtered.map(renderCard).join('')}
            </div>
          </section>
        `;
      }
    }

    function renderRawTable(files) {
      const tbody = document.getElementById('raw-files-tbody');
      const q = searchQuery.trim().toLowerCase();
      const filtered = files.filter(f => {
        if (!q) return true;
        return (f.repo + ' ' + f.path + ' ' + f.cat).toLowerCase().includes(q);
      });

      tbody.innerHTML = filtered.map(f => {
        const fullUrl = f.path === 'index.html'
          ? `${BASE_URL}/${f.repo}/`
          : `${BASE_URL}/${f.repo}/${f.path}`;
        return `
          <tr>
            <td style="font-weight: 600;">${f.repo}</td>
            <td><span class="tag">${f.cat}</span></td>
            <td><a href="${fullUrl}" target="_blank" rel="noopener">${f.repo}/${f.path}</a></td>
            <td style="text-align: right;">
              <button class="mini-btn" onclick="copyUrl('${fullUrl}')" title="URL 복사">🔗</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function syncFromGitHub() {
      const btn = document.getElementById('sync-github-btn');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> 동기화 중...';
      try {
        const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100`);
        if (!res.ok) throw new Error('GitHub API 호출 제한 또는 오류');
        const repos = await res.json();
        const pageRepos = repos.filter(r => r.has_pages);
        const discovered = [];

        for (const r of pageRepos) {
          try {
            const treeRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${r.name}/git/trees/${r.default_branch}?recursive=1`);
            if (!treeRes.ok) continue;
            const treeData = await treeRes.json();
            const htmlFiles = (treeData.tree || []).filter(t => t.path && t.path.endsWith('.html'));
            const catLabel = r.name.includes('coffee') ? '☕ 커피'
              : r.name.includes('taiwan') ? '✈️ 대만'
              : r.name.includes('realty') ? '🏢 부동산' : '📄 기타';
            htmlFiles.forEach(hf => {
              discovered.push({ repo: r.name, cat: catLabel, path: hf.path });
            });
          } catch (e) {}
        }

        if (discovered.length > 0) {
          window.__rawFiles = discovered;
          renderRawTable(discovered);
          showToast(`GitHub에서 ${discovered.length}개의 HTML 파일을 불러왔습니다`);
        } else {
          showToast('기본 목록을 유지합니다');
        }
      } catch (err) {
        showToast('GitHub API 조회 실패 (기본 목록 표시)');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🔄</span> GitHub 실시간 동기화';
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      detectDevice();
      window.addEventListener('resize', detectDevice);

      window.__rawFiles = INITIAL_RAW_FILES;
      updateCounts();
      renderPortal();
      renderRawTable(window.__rawFiles);

      // Category Tabs
      document.querySelectorAll('#category-tabs .tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#category-tabs .tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategory = btn.getAttribute('data-cat');
          renderPortal();
        });
      });

      // Search Input
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderPortal();
        renderRawTable(window.__rawFiles);
      });

      // Keyboard shortcut '/' for search
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        } else if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.blur();
        }
      });

      // Theme toggle
      const themeBtn = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      function syncThemeIcon() {
        const cur = document.documentElement.getAttribute('data-theme');
        themeIcon.textContent = cur === 'dark' ? '☀️' : '🌙';
      }
      syncThemeIcon();

      themeBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('portal_theme', next); } catch (e) {}
        syncThemeIcon();
      });

      // GitHub Sync
      document.getElementById('sync-github-btn').addEventListener('click', syncFromGitHub);
    });
  </script>
</body>
</html>
